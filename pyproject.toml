[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-management-sdk"
version = "0.1.0"
description = "MCP server exposing deterministic aggregation, BM25 search and sampled reports over an IT incident-management event log"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pm4py>=2.7",
    "mcp>=2.1",
    "starlette",
]

[project.scripts]
incident-management-mcp = "incident_management.mcp_server:main"
incident-management-gui = "incident_management.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: exercises the full 141k-row dataset"]