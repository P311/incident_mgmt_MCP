[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-management-sdk"
version = "0.1.0"
description = "Loader and validation helpers for the UCI Incident Management event log"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pm4py>=2.7",
    "mcp>=2.1",
]

[project.scripts]
incident-management-mcp = "incident_management.mcp_server:main"
incident-management-gui = "incident_management.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_management = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: exercises the full 141k-row dataset"]